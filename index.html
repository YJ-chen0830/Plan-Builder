<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>工程計畫書產生器 | Plan Builder</title>
<style>
:root{
  --navy:#0b1f3a;--navy2:#13284a;--gold:#c9a14a;--gold2:#e0bf6e;
  --bg:#f5f3ee;--ink:#1c2530;--line:#d8d2c2;--card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans TC","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;}
/* ─── Top bar ─── */
#topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#f5f3ee;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:10;}
#topbar h1{font-size:17px;font-weight:700;}
#topbar span{color:var(--gold2);font-size:12px;border-left:1px solid rgba(255,255,255,.2);padding-left:14px;}
#topbar .spacer{flex:1;}
.top-btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:600;}
.top-btn.primary{background:var(--gold);color:var(--navy);}
.top-btn.secondary{background:rgba(255,255,255,.12);color:#f5f3ee;border:1px solid rgba(255,255,255,.2);}
.top-btn:hover{filter:brightness(1.1);}
/* ─── Layout ─── */
#layout{display:flex;flex:1;overflow:hidden;}
/* ─── Left panel ─── */
#left{width:320px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;}
#left-tabs{display:flex;border-bottom:1px solid var(--line);}
.ltab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:#888;border-bottom:2px solid transparent;}
.ltab.active{color:var(--navy);border-bottom:2px solid var(--gold);}
#left-content{padding:16px;flex:1;}
.section-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px;border-left:3px solid var(--gold);padding-left:8px;}
label{display:block;font-size:11.5px;color:#666;margin:8px 0 3px;}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:6px 9px;border:1px solid #ccc;border-radius:5px;
  font-size:13px;background:#fafaf8;font-family:inherit;
}
textarea{resize:vertical;font-family:"Courier New",monospace;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.plan-type-btn{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border:1.5px solid var(--line);border-radius:7px;background:#fafaf8;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy);transition:all .15s;}
.plan-type-btn:hover{border-color:var(--gold);background:#fff8e6;}
.plan-type-btn.active{border-color:var(--gold);background:#fff8e6;color:var(--navy);}
.plan-type-btn .sub{font-size:11px;color:#888;font-weight:400;}
.module-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0ede5;font-size:13px;}
.module-item input[type=checkbox]{width:auto;accent-color:var(--gold);}
.module-item label{margin:0;flex:1;cursor:pointer;}
/* ─── Preview ─── */
#preview-wrap{flex:1;overflow-y:auto;background:#e8e5de;padding:24px;display:flex;flex-direction:column;align-items:center;gap:0;}
/* ─── Document Pages ─── */
.page{
  width:210mm;min-height:297mm;background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  padding:18mm 15mm;margin-bottom:16px;
  position:relative;font-family:"Noto Sans TC",serif;
  font-size:11pt;line-height:1.8;color:#111;
}
/* Cover page */
.cover{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:267mm;}
.cover .logo-wrap{margin-bottom:30px;}
.cover .logo-wrap svg{width:60px;height:60px;}
.cover .project-name{font-size:22pt;font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.4;}
.cover .plan-title{font-size:16pt;font-weight:700;color:var(--navy);margin-bottom:40px;border-bottom:2px solid var(--gold);padding-bottom:12px;width:80%;}
.cover .meta-table{width:80%;border-collapse:collapse;margin:0 auto;text-align:left;}
.cover .meta-table td{padding:8px 12px;border-bottom:1px solid #ddd;font-size:12pt;}
.cover .meta-table td:first-child{width:38%;font-weight:600;color:var(--navy);}
.cover .date-line{margin-top:40px;font-size:13pt;color:#555;}
/* Review table page */
.review-page{page-break-before:always;}
.review-page h2{font-size:14pt;font-weight:700;color:var(--navy);text-align:center;margin-bottom:20px;border-bottom:2px solid var(--navy);padding-bottom:8px;}
.review-table{width:100%;border-collapse:collapse;font-size:10pt;}
.review-table td,.review-table th{border:1px solid #999;padding:6px 8px;vertical-align:top;}
.review-table th{background:#f0f0f0;font-weight:600;text-align:center;}
.sig-box{height:60px;border:1px solid #999;margin:4px 0;}
/* TOC */
.toc{page-break-before:always;}
.toc h2{font-size:14pt;font-weight:700;color:var(--navy);text-align:center;margin-bottom:16px;}
.toc-item{display:flex;justify-content:space-between;padding:3px 0;font-size:10.5pt;border-bottom:1px dotted #ccc;}
.toc-item .ch{font-weight:600;color:var(--navy);}
.toc-item .pg{color:#888;}
/* Chapter */
.doc-section{page-break-before:always;}
.doc-section:first-child{page-break-before:auto;}
.ch-title{font-size:14pt;font-weight:700;color:var(--navy);border-left:4px solid var(--gold);padding-left:10px;margin:0 0 16px;}
.sub-title{font-size:12pt;font-weight:700;color:var(--navy);margin:14px 0 8px;}
.sub2-title{font-size:11pt;font-weight:700;margin:10px 0 6px;}
p{margin-bottom:8px;text-indent:2em;}
ul{margin:6px 0 10px 2em;}
li{margin-bottom:4px;}
table.content-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:10pt;}
table.content-table th,table.content-table td{border:1px solid #aaa;padding:5px 8px;}
table.content-table th{background:#f0f0f0;font-weight:700;text-align:center;}
.check-table th,table.check-table td{border:1px solid #aaa;padding:4px 6px;font-size:9.5pt;}
.check-table th{background:#f0f0f0;text-align:center;font-weight:700;}
.flow-box{border:1.5px solid #aaa;border-radius:6px;padding:10px 14px;margin:8px 0;background:#fafaf8;font-size:10.5pt;}
.flow-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.flow-step .num{background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px;}
.page-num{position:absolute;bottom:10mm;right:15mm;font-size:9pt;color:#888;}
/* Footer disclaimer */
.doc-footer{margin-top:30px;padding-top:10px;border-top:1px solid #ddd;font-size:9pt;color:#777;text-align:center;}
/* Responsive: stack editor above preview on narrow screens */
@media(max-width:860px){
  body{height:auto;min-height:100vh;overflow:visible;}
  #topbar{flex-wrap:wrap;padding:10px 14px;}
  #topbar h1{font-size:15px;}
  #topbar span{display:none;}
  #topbar .top-btn{padding:8px 10px;font-size:12.5px;}
  #layout{flex-direction:column;overflow:visible;}
  #left{width:100%;max-height:70vh;border-right:none;border-bottom:1px solid var(--line);}
  #preview-wrap{padding:14px;overflow-y:visible;}
  .page{width:100%!important;min-height:0!important;}
}
/* Print */
@media print{
  body{display:block;}
  #topbar,#left,#preview-wrap{display:none!important;}
  .page{width:100%;box-shadow:none;margin:0;page-break-after:always;padding:15mm 13mm;}
  @page{size:A4;margin:0;}
}
</style>

// ─── Helpers ──────────────────────────────────────────
function v(id){var el=document.getElementById(id);return el?el.value:'';}
function checked(id){var el=document.getElementById(id);return el?el.checked:false;}

function dateToROC(d){
  if(!d)return'';
  var p=d.split('-');if(p.length<3)return d;
  return (parseInt(p[0])-1911)+' 年 '+parseInt(p[1])+' 月 '+parseInt(p[2])+' 日';
}

function submitDateStr(){
  var d=v('p-submit-date');
  if(!d){var n=new Date();return (n.getFullYear()-1911)+' 年 '+(n.getMonth()+1)+' 月 '+n.getDate()+' 日';}
  return dateToROC(d);
}

function ordinal(n){return ['第一','第二','第三','第四','第五','第六','第七','第八','第九','第十'][n-1]||('第'+n);}

// ─── Switching ────────────────────────────────────────
function switchLTab(t){
  ['info','plan','mod'].forEach(function(x){
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
    document.getElementById('panel-'+x).style.display=x===t?'':'none';
  });
}

function setPlan(btn){
  document.querySelectorAll('.plan-type-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  PLAN=btn.dataset.plan;
  var pt=document.getElementById('p-plantype');
  var names={scaffold:'施工架施工計畫書',formwork:'模板工程施工計畫書','formwork-calc':'模板支撐計算書',
    concrete:'混凝土澆置計畫書',excavation:'開挖擋土支撐計畫書',earthwork:'土方暫置計畫書',
    runoff:'逕流廢水計畫書',planting:'分項植栽計畫書',quality:'品質計畫書'};
  if(pt&&names[PLAN])pt.value=names[PLAN];
  // Update params
  var pp=document.getElementById('plan-params');
  var ppt=document.getElementById('plan-params-title');
  pp.innerHTML=PLAN_PARAMS_HTML[PLAN]||'';
  ppt.style.display=PLAN_PARAMS_HTML[PLAN]?'':'none';
  // Re-init modules
  initModules();
  refreshPreview();
}

function initModules(){
  var mods=PLAN_MODULES[PLAN]||[];
  if(!MODULES[PLAN]){MODULES[PLAN]={};}
  var ml=document.getElementById('module-list');
  ml.innerHTML='';
  mods.forEach(function(m){
    if(MODULES[PLAN][m.id]===undefined)MODULES[PLAN][m.id]=m.default;
    var div=document.createElement('div');div.className='module-item';
    var cb=document.createElement('input');cb.type='checkbox';cb.id='mod-'+m.id;
    cb.checked=MODULES[PLAN][m.id];
    cb.addEventListener('change',function(){MODULES[PLAN][m.id]=this.checked;refreshPreview();});
    var lbl=document.createElement('label');lbl.htmlFor='mod-'+m.id;lbl.textContent=m.label;
    div.appendChild(cb);div.appendChild(lbl);ml.appendChild(div);
  });
}

function isOn(id){return MODULES[PLAN]&&MODULES[PLAN][id]!==false;}

    '<li>工程完工後，所有品質紀錄完整移交主辦機關或依規定保存。</li>'+
    '</ul>'+

    '<div class="doc-footer">⚠ 本品質計畫書依公共工程施工品質管理作業要點編製，實際執行應配合工程契約規定及監造單位指示辦理。</div>'+
    '<div class="page-num">11</div>'+
    '</div>';

  return out;
}

// ─── Stub pages for other plan types ─────────────────
function pagesStub(planId){
  return '<div class="page doc-section" style="text-align:center;padding-top:60mm;">'+
    '<div style="font-size:16pt;color:#bbb;margin-bottom:16px;">📄</div>'+
    '<div style="font-size:13pt;color:#999;">'+v('p-plantype')+'</div>'+
    '<div style="font-size:11pt;color:#bbb;margin-top:10px;">此計畫類型內容持續建置中<br>（已可列印封面與審查核章表）</div>'+
    '</div>';
}

// ─── Main render ──────────────────────────────────────
function refreshPreview(){
  var out='';
  var chapterLabels=[];

  if(isOn('cover'))out+=pageCover();

  if(isOn('review'))out+=pageReview();

  // Build chapter list for TOC
  var mods=PLAN_MODULES[PLAN]||[];
  mods.forEach(function(m){
    if(m.id==='cover'||m.id==='review'||m.id==='toc')return;
    if(isOn(m.id))chapterLabels.push(m.label);
  });

  if(isOn('toc'))out+=pageTOC(chapterLabels);

  // Content pages
  if(PLAN==='scaffold'){out+=pagesScaffold();}
  else if(PLAN==='formwork-calc'){out+=pagesFormworkCalc();}
  else if(PLAN==='quality'){out+=pagesQuality();}
  else{out+=pagesStub(PLAN);}

  document.getElementById('doc-container').innerHTML=out;
}

// ─── Formwork Calc pages (placeholder that auto-computes) ──
function pagesFormworkCalc(){
  var L=parseFloat(v('fc-L'))||15.6;
  var W=parseFloat(v('fc-W'))||16.1;
  var t=parseFloat(v('fc-t'))||0.30;
  var H=parseFloat(v('fc-H'))||2.8;
  var sv=parseFloat(v('fc-sv'))||0.8;
  var sp=parseFloat(v('fc-sp'))||0.6;

  // Loads
  var wc=2.4; // tf/m³
  var wL=0.1; // tf/m²  施工活載
  var wu=1.6*(wc*t+wL); // LRFD factored
  var wuL=wu*sv; // 縱向梁線載重

  var out='';
  if(isOn('fc-ch1'))out+=
    '<div class="page doc-section">'+
    '<div class="ch-title">第一章、工程概要</div>'+
    '<div class="sub-title">施工項目</div>'+
    '<ul>'+
    '<li>施工項目：'+v('p-name')+'  模板支撐</li>'+
    '<li>支撐範圍：樓板尺寸 '+L+'m × '+W+'m，版厚 '+t+'m</li>'+
    '<li>樓層高度：'+H+' m</li>'+
    '</ul>'+
    '<div class="sub-title">基本假設</div>'+
    '<ul>'+
    '<li>模板荷重為均佈載重。</li>'+
    '<li>混凝土單位重：2.4 tf/m³</li>'+
    '<li>施工活載（人員器具）：0.1 tf/m²</li>'+
    '<li>設計方法：LRFD（載重放大係數 1.6）</li>'+
    '</ul>'+
    '<div class="page-num">1</div>'+
    '</div>';

  if(isOn('fc-ch3'))out+=
    '<div class="page doc-section">'+
    '<div class="ch-title">第三章、模板支撐計算式</div>'+
    '<div class="sub-title">載重計算</div>'+
    '<p>版厚 t = '+t+' m，混凝土單位重 = 2.4 tf/m³</p>'+
    '<p>活載重（施工人員器具） = 0.1 tf/m²</p>'+
    '<p>LRFD 設計載重：</p>'+
    '<p style="margin-left:4em;font-family:monospace;">w<sub>u</sub> = 1.6 × (2.4 × '+t+' + 0.1) = <b>'+wu.toFixed(4)+' tf/m²</b></p>'+
    '<p>縱向梁（間距 '+sv+' m）每延米載重：</p>'+
    '<p style="margin-left:4em;font-family:monospace;">(w<sub>u</sub>)<sub>L</sub> = '+wu.toFixed(4)+' × '+sv+' = <b>'+wuL.toFixed(4)+' tf/m</b></p>'+
    '<div class="doc-footer">⚠ 本計算書為輔助計算工具產出，計算結果仍須由依法登記之結構技師簽證並負最終法律責任。</div>'+
    '<div class="page-num">2</div>'+
    '</div>';

  return out;
}

initModules();
refreshPreview();
